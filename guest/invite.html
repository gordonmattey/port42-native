<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Port42 · open a port</title>
<style>
  :root { --bg:#050807; --card:#0b1210; --line:#1d3a33; --text:#d6e2df; --dim:#7f918c; --accent:#00d4aa; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* a section's own display rule must not beat hidden */
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line);
         font-size: 12px; flex: none; }
  #bar b { color: var(--accent); font-weight: normal; text-shadow: 0 0 8px rgba(0,212,170,.5); }
  #status { color: var(--bad); }
  .spacer { flex: 1; }
  p { line-height: 1.5; margin: 8px 0; }
  .dim { color: var(--dim); font-size: 12px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  a.button, button { font: inherit; color: var(--accent); background: transparent; border: 1px solid var(--accent);
                     border-radius: 8px; padding: 9px 16px; cursor: pointer; text-decoration: none; }
  a.button.small { padding: 4px 10px; border-radius: 6px; }
  a.button.quiet { color: var(--dim); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  input { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
          border-radius: 6px; padding: 9px 10px; width: 100%; }
  label { display: block; margin: 14px 0 6px; color: var(--dim); font-size: 12px; }
  .error { color: var(--bad); min-height: 1.2em; margin-top: 10px; }
  #paste { max-width: 520px; margin: 0 auto; padding: 56px 16px; width: 100%; }
  #port { flex: 1; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  #stage { position: relative; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; background: #000; display: block; transition: opacity .3s; }
  body.offline iframe { opacity: .35; pointer-events: none; }
  #gate { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(380px, 90%);
          background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px;
          box-shadow: 0 0 40px rgba(0,212,170,.12); }
  #chat { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #chat-list { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; }
  .entry { margin: 0 0 8px; line-height: 1.4; word-wrap: break-word; }
  .entry b { color: var(--accent); font-weight: normal; }
  #chat-form { padding: 8px; border-top: 1px solid var(--line); }
  @media (max-width: 720px) { #port { grid-template-columns: 1fr; grid-template-rows: 1fr 38%; }
    #chat { border-left: 0; border-top: 1px solid var(--line); } #bar #title { display: none; } }
</style>
</head>
<body>
<header id="bar">
  <b>port42</b>
  <span id="title"></span>
  <span id="status"></span>
  <span class="spacer"></span>
  <a id="open-app" class="button small" href="#" hidden>Open in Port42</a>
  <a id="get-app" class="button small quiet" href="#">Get Port42</a>
</header>

<main id="paste" hidden>
  <p>Someone shared a port with you? Paste the link they sent.</p>
  <form id="paste-form">
    <input id="paste-input" placeholder="https://tele.port42.ai/#…" autocomplete="off" spellcheck="false">
    <div class="buttons"><button type="submit">Open</button></div>
    <p id="paste-error" class="error"></p>
  </form>
</main>

<section id="port" hidden>
  <div id="stage">
    <iframe id="frame" sandbox="allow-scripts allow-forms" title="the shared port" src="about:blank"></iframe>
    <form id="gate">
      <p id="who"></p>
      <p id="what" class="dim"></p>
      <label for="name">your name, as they will see it</label>
      <input id="name" autocomplete="nickname" maxlength="40">
      <div id="code-row" hidden>
        <label for="code">the six-digit code they sent you</label>
        <input id="code" inputmode="numeric" maxlength="6">
      </div>
      <div class="buttons"><button id="join-button" type="submit">Open</button></div>
      <p id="join-error" class="error"></p>
      <p id="when" class="dim"></p>
    </form>
  </div>
  <aside id="chat">
    <div id="chat-list"></div>
    <form id="chat-form"><input id="chat-input" placeholder="say something" autocomplete="off" disabled></form>
  </aside>
</section>

<script type="module" src="dist/port42-guest.js" integrity="sha384-+zFnyggipzkAs3KBjkxZEa5BaOf/UQRncYp3hRo60DdtY2Qee7BzoHMJTSYR+31R"></script>
</body>
</html>
