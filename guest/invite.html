<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Port42 · open a port</title>
<style>
  /* A Port42 tile in the browser: the same chrome, colours and chat as the app (Port42Theme,
     ShellTile, PortChatPanel). */
  :root { --bg:#000; --card:#0f1217; --input:#1a1a1a; --text:#e0e0e0; --dim:#888; --accent:#00d4aa;
          --edge:rgba(0,212,170,.45); --line:rgba(0,212,170,.25); --bad:#ff4444; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* a section's own display rule must not beat hidden */
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { padding: 14px; background: radial-gradient(ellipse at 50% 30%, #07110f 0%, #000 70%); }
  .tile { height: 100%; display: flex; flex-direction: column; border: 1px solid var(--edge); border-radius: 10px;
          overflow: hidden; background: #000; box-shadow: 0 0 40px rgba(0,212,170,.08); }
  #bar { height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 10px;
         background: var(--card); border-bottom: 1px solid var(--line); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  #title { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 9px; color: var(--accent); background: var(--input); border: .5px solid rgba(0,212,170,.35);
          border-radius: 99px; padding: 1px 6px; white-space: nowrap; }
  body.offline .pill { color: var(--text); border-color: transparent; }
  #status { color: var(--bad); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .chip { font: inherit; font-size: 10px; color: var(--dim); background: transparent; border: 0; padding: 3px 6px;
          border-radius: 99px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .chip:hover { background: var(--input); color: var(--text); }
  .chip.accent { color: var(--accent); }
  #chat-toggle { display: flex; align-items: center; gap: 4px; }
  #chat-toggle.open { background: var(--input); color: var(--accent); }
  .avatar { width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 8px;
            font-weight: bold; color: rgba(0,0,0,.75); border: 1.5px solid var(--card); margin-left: -4px; }
  #chat-count { font-size: 8px; font-weight: bold; color: #000; background: var(--accent); border-radius: 99px;
                padding: 1px 4px; margin-left: 4px; }
  #body { position: relative; flex: 1; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; background: #000; display: block; transition: opacity .3s; }
  body.offline iframe { opacity: .35; pointer-events: none; }
  #chat { position: absolute; top: 0; left: 0; right: 0; height: 45%; min-height: 220px; display: flex;
          flex-direction: column; background: var(--card); border-bottom: 1px solid var(--line);
          box-shadow: 0 6px 12px rgba(0,0,0,.45); transform: translateY(-105%); transition: transform .25s ease; }
  #chat.open { transform: none; }
  #chat-list { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .empty { color: var(--dim); font-size: 10px; }
  .run { margin: 0 0 10px; display: flex; flex-direction: column; align-items: flex-start; }
  .run.mine { align-items: flex-end; }
  .run .who { font-size: 9px; color: var(--dim); margin: 0 0 3px 2px; }
  .msg { max-width: 80%; padding: 5px 9px; border-radius: 10px; background: var(--input); line-height: 1.4;
         word-wrap: break-word; margin-top: 2px; }
  .run.mine .msg { background: rgba(0,212,170,.16); }
  .run.system .msg { background: transparent; color: var(--dim); font-size: 10px; padding: 2px 0; }
  #chat-form { padding: 8px; border-top: 1px solid var(--line); flex: none; }
  input { font: inherit; color: var(--text); background: var(--input); border: 1px solid #333;
          border-radius: 6px; padding: 8px 10px; width: 100%; }
  input:focus { outline: none; border-color: var(--line); }
  .card { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(380px, 92%);
          background: var(--card); border: 1px solid var(--edge); border-radius: 10px; padding: 18px 20px;
          box-shadow: 0 0 40px rgba(0,212,170,.14); }
  .card p { line-height: 1.5; margin: 6px 0; }
  .dim { color: var(--dim); font-size: 10px; }
  label { display: block; margin: 12px 0 5px; color: var(--dim); font-size: 10px; }
  .buttons { display: flex; gap: 10px; margin-top: 14px; }
  button { font: inherit; color: var(--accent); background: transparent; border: 1px solid var(--accent);
           border-radius: 8px; padding: 7px 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .error { color: var(--bad); min-height: 1.2em; margin-top: 8px; font-size: 11px; }
  @media (max-width: 720px) { body { padding: 0; } .tile { border-radius: 0; border: 0; }
    #bar .chip.get { display: none; } #chat { height: 60%; } }
</style>
</head>
<body>
<div class="tile">
  <header id="bar">
    <span class="dot"></span>
    <span id="title">port42</span>
    <span id="pill" class="pill" hidden></span>
    <span id="status"></span>
    <span class="spacer"></span>
    <button id="chat-toggle" class="chip" type="button" hidden title="Chat">💬<span id="chat-people"></span><span id="chat-count" hidden></span></button>
    <a id="open-app" class="chip accent" href="#" hidden>Open in Port42</a>
    <a id="get-app" class="chip get" href="#">Get Port42</a>
  </header>

  <div id="body">
    <section id="paste" class="card" hidden>
      <p>Someone shared a port with you? Paste the link they sent.</p>
      <form id="paste-form">
        <input id="paste-input" placeholder="https://tele.port42.ai/#…" autocomplete="off" spellcheck="false">
        <div class="buttons"><button type="submit">Open</button></div>
        <p id="paste-error" class="error"></p>
      </form>
    </section>

    <section id="port" hidden>
      <iframe id="frame" sandbox="allow-scripts allow-forms" title="the shared port" src="about:blank"></iframe>
      <aside id="chat">
        <div id="chat-list"><p class="empty">No messages yet. What you say here belongs to this port.</p></div>
        <form id="chat-form"><input id="chat-input" placeholder="say something" autocomplete="off" disabled></form>
      </aside>
      <form id="gate" class="card">
        <p id="who"></p>
        <p id="what" class="dim"></p>
        <label for="name">your name, as they will see it</label>
        <input id="name" autocomplete="nickname" maxlength="40">
        <div id="code-row" hidden>
          <label for="code">the six-digit code they sent you</label>
          <input id="code" inputmode="numeric" maxlength="6">
        </div>
        <div class="buttons"><button id="join-button" type="submit">Open</button></div>
        <p id="join-error" class="error"></p>
        <p id="when" class="dim"></p>
      </form>
    </section>
  </div>
</div>

<script type="module" src="dist/port42-guest.js" integrity="sha384-h4twMqioKzrA5FIFrsdhOJRRdO3r1cHrKFoRqflVOnFjb2LFMlI1cueS3CQcfns3"></script>
</body>
</html>
