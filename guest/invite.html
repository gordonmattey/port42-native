<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Port42 · open a port</title>
<style>
  :root { --bg:#050807; --card:#0b1210; --line:#1d3a33; --text:#d6e2df; --dim:#7f918c; --accent:#00d4aa; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 18px; color: var(--accent); margin: 0 0 18px; text-shadow: 0 0 8px rgba(0,212,170,.5); }
  p { line-height: 1.5; margin: 8px 0; }
  .dim { color: var(--dim); font-size: 12px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  a.button, button { font: inherit; color: var(--accent); background: transparent; border: 1px solid var(--accent);
                     border-radius: 8px; padding: 10px 16px; cursor: pointer; text-decoration: none; }
  a.button.quiet, button.quiet { color: var(--dim); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  input { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
          border-radius: 6px; padding: 9px 10px; width: 100%; }
  label { display: block; margin: 14px 0 6px; color: var(--dim); font-size: 12px; }
  .error { color: var(--bad); min-height: 1.4em; margin-top: 12px; }
  #port { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr; }
  #bar { grid-column: 1 / 3; display: flex; gap: 12px; align-items: center; padding: 8px 14px;
         border-bottom: 1px solid var(--line); font-size: 12px; }
  #bar b { color: var(--accent); font-weight: normal; }
  #status { color: var(--bad); }
  iframe { width: 100%; height: 100%; border: 0; background: #000; transition: opacity .3s; }
  body.offline iframe { opacity: .35; pointer-events: none; }
  #chat { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #chat-list { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; }
  .entry { margin: 0 0 8px; line-height: 1.4; word-wrap: break-word; }
  .entry b { color: var(--accent); font-weight: normal; }
  #chat-form { padding: 8px; border-top: 1px solid var(--line); }
  @media (max-width: 720px) { #port { grid-template-columns: 1fr; grid-template-rows: auto 1fr 38%; }
    #bar { grid-column: 1; } #chat { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main>
  <section id="broken" hidden>
    <h1>port42</h1>
    <p>This link is not an invite Port42 can read. Ask for it again.</p>
  </section>

  <section id="intro" hidden>
    <h1>port42</h1>
    <p id="who"></p>
    <p id="what"></p>
    <p id="when" class="dim"></p>
    <p id="intro-note" class="error"></p>
    <div class="buttons">
      <a id="open-app" class="button" href="#">Open in Port42</a>
      <button id="open-here" type="button">Open here</button>
      <a id="get-app" class="button quiet" href="#">Get Port42</a>
    </div>
    <p class="dim">Open here works in this browser, with nothing to install. Nothing happens until you choose.</p>
  </section>

  <section id="join" hidden>
    <h1>port42</h1>
    <form id="join-form">
      <label for="name">your name, as they will see it</label>
      <input id="name" autocomplete="nickname" maxlength="40" required>
      <div id="code-row" hidden>
        <label for="code">the six-digit code they sent you</label>
        <input id="code" inputmode="numeric" maxlength="6">
      </div>
      <div class="buttons"><button id="join-button" type="submit">Join</button></div>
      <p id="join-error" class="error"></p>
    </form>
  </section>
</main>

<section id="port" hidden>
  <div id="bar"><b>port42</b><span id="status"></span></div>
  <iframe id="frame" sandbox="allow-scripts allow-forms" title="the shared port"></iframe>
  <aside id="chat">
    <div id="chat-list"></div>
    <form id="chat-form"><input id="chat-input" placeholder="say something" autocomplete="off"></form>
  </aside>
</section>

<script type="module" src="dist/port42-guest.js"></script>
</body>
</html>
