# Secret scanning (SEC-01). gitleaks' default rules, plus PostHog personal API keys: two phx_ keys
# were committed in March (0eef19d, 2c47c90) and shipped in the DMGs, and the defaults do not know the
# prefix. Run by .github/workflows/secrets.yml on every push and by scripts/pre-commit-secrets.sh.
title = "port42"

[extend]
useDefault = true

[[rules]]
id = "posthog-personal-api-key"
description = "PostHog personal API key (phx_), account-wide read/write; only the public phc_ project key may ship"
regex = '''\bphx_[A-Za-z0-9]{20,}\b'''
keywords = ["phx_"]

# Fixtures that look like keys and are not: the RFC 8032 Ed25519 test vector and other test data.
[allowlist]
description = "test fixtures"
paths = [
  '''(^|/)Tests/''',
  '''_test\.go$''',
  '''(^|/)guest/test/''',
]
