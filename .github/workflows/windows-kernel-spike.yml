# Spike, not CI for the product. It answers one question with a build instead of an opinion:
# how much of Port42's kernel compiles off Apple, and does GRDB compile on Windows?
#
# `spikes/windows-kernel/carve.sh` generates a package from the tree's own sources (nothing is
# duplicated in git), then prunes whatever fails until the build is green and PRINTS what it dropped.
# The dropped list is the deliverable: it is the seam list between kernel and shell.
#
# Scoped to its own branch and manual runs, so it never gates anyone's work.
name: windows kernel spike

on:
  push:
    branches: [research]
  workflow_dispatch:

jobs:
  windows:
    # windows-latest now carries Visual Studio 18 (MSVC 14.51), whose STL refuses any compiler older
    # than Clang 20: "error STL1000: Unexpected compiler version, expected Clang 20 or newer". Swift
    # 6.2 ships an older Clang, so the pairing fails before a line of Port42 is read. Pinned to the
    # 2022 image, and noted as a finding: Swift on Windows is sensitive to the MSVC it is paired
    # with, which is a standing maintenance cost rather than a one-time setup step.
    runs-on: windows-2022
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - uses: actions/checkout@v4
      - name: swift version
        run: swift --version
      - name: carve the kernel
        shell: bash
        run: ./spikes/windows-kernel/carve.sh
      - name: build the kernel, pruning what fails
        shell: bash
        working-directory: spikes/windows-kernel/generated
        run: |
          set +e -o posix
          green=0
          for r in $(seq 1 20); do
            out=$(swift build --target Port42Kernel 2>&1); rc=$?
            if [ $rc -eq 0 ]; then echo "WINDOWS GREEN after $((r-1)) prune round(s)"; green=1; break; fi
            echo "$out" | grep -E "error:" | sort -u | head -5
            bad=$(echo "$out" | grep -oE "Port42Kernel[\\/][A-Za-z+0-9]+\.swift[^ ]*: error:" \
                  | sed -E "s|.*[\\/]([A-Za-z+0-9]+)\.swift.*|\1|" | sort -u || true)
            if [ -z "$bad" ]; then
              echo "TOOLCHAIN OR LINK FAILURE, not a per-file one. Build said:"; echo "$out" | tail -25
              echo "NO WINDOWS RESULT: the spike cannot answer the question in this environment."; exit 1
            fi
            for b in $bad; do echo "  round $r: dropping $b"; rm -f "Sources/Port42Kernel/$b.swift"; done
          done
          if [ "$green" != "1" ]; then echo "NO RESULT: still failing when the round limit ran out"; exit 1; fi
          echo "SURVIVES ON WINDOWS: $(ls Sources/Port42Kernel | wc -l) files, $(cat Sources/Port42Kernel/*.swift | wc -l) lines"
          ls Sources/Port42Kernel
      - name: does GRDB build on Windows
        shell: bash
        working-directory: spikes/windows-kernel/generated
        continue-on-error: true
        run: swift build --target GRDBProbe 2>&1 | tail -30

  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - name: carve the kernel
        run: ./spikes/windows-kernel/carve.sh
      - name: build the kernel, pruning what fails
        working-directory: spikes/windows-kernel/generated
        run: |
          set +e
          green=0
          for r in $(seq 1 20); do
            out=$(swift build --target Port42Kernel 2>&1); rc=$?
            if [ $rc -eq 0 ]; then echo "LINUX GREEN after $((r-1)) prune round(s)"; green=1; break; fi
            bad=$(echo "$out" | grep -oE "/Port42Kernel/[A-Za-z+0-9]+\.swift[^ ]*: error:" \
                  | sed -E "s|/Port42Kernel/([A-Za-z+0-9]+)\.swift.*|\1|" | sort -u || true)
            if [ -z "$bad" ]; then
              echo "TOOLCHAIN OR LINK FAILURE, not a per-file one:"; echo "$out" | tail -25; exit 1
            fi
            for b in $bad; do echo "  round $r: dropping $b"; rm -f "Sources/Port42Kernel/$b.swift"; done
          done
          if [ "$green" != "1" ]; then echo "NO RESULT: still failing when the round limit ran out"; exit 1; fi
          echo "SURVIVES ON LINUX: $(ls Sources/Port42Kernel | wc -l) files, $(cat Sources/Port42Kernel/*.swift | wc -l) lines"
      - name: does GRDB build on Linux
        working-directory: spikes/windows-kernel/generated
        continue-on-error: true
        run: swift build --target GRDBProbe 2>&1 | tail -5

  # Question 5 of the spike: the Go side is the only part of the tree with a plausible claim to
  # already being portable. Cross-compiled rather than run, because the claim under test is that it
  # COMPILES for Windows, and GOOS does that from anywhere.
  go-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: gateway, cli and shim for windows/amd64
        run: |
          set -e
          for d in gateway cli shim; do
            (cd $d && GOOS=windows GOARCH=amd64 go build -o /dev/null ./...) && echo "$d: builds for windows/amd64"
          done
      - name: the Go suites still pass on Linux
        run: |
          set -e
          for d in gateway cli shim; do (cd $d && go test ./... ); done
