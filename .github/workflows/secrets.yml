# Secret scanning (SEC-01): every push and pull request is scanned with gitleaks, using
# .gitleaks.toml (the default rules plus PostHog personal phx_ keys). Only the commits being added are
# scanned: history already holds known, revoked-or-to-be-revoked findings (the two March phx_ keys), and
# a scan of all of it would fail every run. A new secret fails the run.
name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: commits this run adds
        id: range
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=-1 ${{ github.sha }}" >> "$GITHUB_OUTPUT"   # a new branch: its tip commit
          fi
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --log-opts="${{ steps.range.outputs.range }}" --redact --no-banner -v
