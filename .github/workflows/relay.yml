# The relay anyone can run (nautilus Phase 4.9). Runs only when a `relay-v*` tag is pushed, or by hand:
# builds the relay image for x86 and ARM and pushes it to GitHub's container registry, and attaches the
# relay binaries to that tag's release. Nothing here touches the app or its DMG.
name: relay

on:
  push:
    tags: ["relay-v*"]
  workflow_dispatch:

# Least privilege (BLD-09): read-only by default; each job asks for the one write it needs. Actions are
# pinned by commit SHA, so a moved tag cannot change what runs with these tokens.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/port42-relay
          tags: |
            type=match,pattern=relay-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/relay-v') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: gateway
          file: gateway/relay.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  binaries:
    # Cross-compiled on Linux: the macOS binaries are unsigned here (no Developer ID in CI). Sign them
    # locally with scripts/relay-dist.sh and replace them on the release when that matters.
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/relay-v')
    permissions:
      contents: write
      id-token: write       # BLD-10: signs the build-provenance attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: gateway/go.mod
      - run: scripts/relay-dist.sh "${GITHUB_REF_NAME#relay-}"
      # BLD-10: every archive and SHA256SUMS gets a signed build-provenance attestation, so a download
      # can be checked against this repository and this workflow: gh attestation verify <file> --repo
      # gordonmattey/port42-native. The checksums alone were unsigned, so they proved nothing about where
      # a file came from.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/relay/*.tar.gz
            dist/relay/*.zip
            dist/relay/SHA256SUMS
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --latest=false --title "Port42 relay ${GITHUB_REF_NAME#relay-}" \
                 --notes "The relay anyone can run. See docs/run-a-relay.md."
          gh release upload "$GITHUB_REF_NAME" dist/relay/*.tar.gz dist/relay/*.zip dist/relay/SHA256SUMS --clobber
